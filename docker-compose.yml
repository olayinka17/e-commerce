version: "3.8"
networks:
  ecommerce-network:
    external: true
volumes:
  ecommerce-data:
  cache-data:
  controller0-data:
  controller1-data:
  controller2-data:
  server0-data:
  server1-data:
  server2-data:
  server3-data:

services:
  controller-0:
    image: confluentinc/cp-kafka@sha256:997e05f8551c64d1e643baf269237e3bb13808e5909d2b936e8e986226bfc78a
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-topics --list --bootstrap-server controller-0:9001 || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 10s
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "controller"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENERS: "CONTROLLER://:9001"
      KAFKA_ADVERTISED_LISTENERS: "CONTROLLER://controller-0:9001"
      KAKFA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@controller-0:9001,2@controller-1:9002,3@controller-2:9003"
      KAFKA_CONTROLLER_BOOTSTRAP_SERVERS: "controller-0:9001"
      CLUSTER_ID: "GCtgBeRZSsq7wLCsyNtdUg"
    volumes:
      - controller0-data:/var/lib/kafka/data
    networks:
      - ecommerce-network
  controller-1:
    image: confluentinc/cp-kafka@sha256:997e05f8551c64d1e643baf269237e3bb13808e5909d2b936e8e986226bfc78a
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-topics --list --bootstrap-server controller-1:9002 || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 10s
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: "controller"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENERS: "CONTROLLER://:9002"
      KAFKA_ADVERTISED_LISTENERS: "CONTROLLER://controller-1:9002"
      KAKFA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@controller-0:9001,2@controller-1:9002,3@controller-2:9003"
      KAFKA_CONTROLLER_BOOTSTRAP_SERVERS: "controller-1:9002"
      CLUSTER_ID: "GCtgBeRZSsq7wLCsyNtdUg"
    volumes:
      - controller1-data:/var/lib/kafka/data
    networks:
      - ecommerce-network

  controller-2:
    image: confluentinc/cp-kafka@sha256:997e05f8551c64d1e643baf269237e3bb13808e5909d2b936e8e986226bfc78a
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-topics --list --bootstrap-server controller-2:9003 || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 10s
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: "controller"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENERS: "CONTROLLER://:9003"
      KAFKA_ADVERTISED_LISTENERS: "CONTROLLER://controller-2:9003"
      KAKFA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@controller-0:9001,2@controller-1:9002,3@controller-2:9003"
      KAFKA_CONTROLLER_BOOTSTRAP_SERVERS: "controller-2:9003"
      CLUSTER_ID: "GCtgBeRZSsq7wLCsyNtdUg"
    volumes:
      - controller2-data:/var/lib/kafka/data
    networks:
      - ecommerce-network

  server-0:
    image: confluentinc/cp-kafka@sha256:997e05f8551c64d1e643baf269237e3bb13808e5909d2b936e8e986226bfc78a
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-topics --list --bootstrap-server server-0:9092 || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 10s
    environment:
      KAFKA_NODE_ID: 4
      KAFKA_PROCESS_ROLES: "broker"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENERS: "PLAINTEXT://:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://server-0:9092"
      KAKFA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@controller-0:9001,2@controller-1:9002,3@controller-2:9003"
      # KAFKA_CONTROLLER_BOOTSTRAP-SERVERS: 'controller-0:9003'
      CLUSTER_ID: "GCtgBeRZSsq7wLCsyNtdUg"
    volumes:
      - server0-data:/var/lib/kafka/data
    networks:
      - ecommerce-network
    depends_on:
      controller-0:
        condition: service_healthy
      controller-1:
        condition: service_healthy
      controller-2:
        condition: service_healthy

  server-1:
    image: confluentinc/cp-kafka@sha256:997e05f8551c64d1e643baf269237e3bb13808e5909d2b936e8e986226bfc78a
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-topics --list --bootstrap-server server-1:9093 || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 10s
    environment:
      KAFKA_NODE_ID: 5
      KAFKA_PROCESS_ROLES: "broker"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENERS: "PLAINTEXT://:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://server-1:9093"
      KAKFA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@controller-0:9001,2@controller-1:9002,3@controller-2:9003"
      # KAFKA_CONTROLLER_BOOTSTRAP-SERVERS: 'controller-0:9003'
      CLUSTER_ID: "GCtgBeRZSsq7wLCsyNtdUg"
    volumes:
      - server1-data:/var/lib/kafka/data
    networks:
      - ecommerce-network
    depends_on:
      controller-0:
        condition: service_healthy
      controller-1:
        condition: service_healthy
      controller-2:
        condition: service_healthy
  server-2:
    image: confluentinc/cp-kafka@sha256:997e05f8551c64d1e643baf269237e3bb13808e5909d2b936e8e986226bfc78a
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-topics --list --bootstrap-server server-2:9094 || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 10s
    environment:
      KAFKA_NODE_ID: 6
      KAFKA_PROCESS_ROLES: "broker"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENERS: "PLAINTEXT://:9094"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://server-2:9094"
      KAKFA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@controller-0:9001,2@controller-1:9002,3@controller-2:9003"
      # KAFKA_CONTROLLER_BOOTSTRAP-SERVERS: 'controller-0:9003'
      KAFKA_CLUSTER_ID: "GCtgBeRZSsq7wLCsyNtdUg"
    volumes:
      - server2-data:/var/lib/kafka/data
    networks:
      - ecommerce-network
    depends_on:
      controller-0:
        condition: service_healthy
      controller-1:
        condtion: service_healthy
      controller-2:
        condition: service_healthy

  server-3:
    image: confluentinc/cp-kafka@sha256:997e05f8551c64d1e643baf269237e3bb13808e5909d2b936e8e986226bfc78a
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-topics --list --bootstrap-server server-3:9095 || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 10s
    environment:
      KAFKA_NODE_ID: 7
      KAFKA_PROCESS_ROLES: "broker"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENERS: "PLAINTEXT://:9095"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://server-3:9095"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@controller-0:9001,2@controller-1:9002,3@controller-2:9003"
      KAKFA_LOG_DIRS: /var/lib/kafka/data
      # KAFKA_CONTROLLER_BOOTSTRAP-SERVERS: 'controller-0:9003'
      KAFKA_CLUSTER_ID: "GCtgBeRZSsq7wLCsyNtdUg"
    volumes:
      - server3-data:/var/lib/kafka/data
    networks:
      - ecommerce-network
    depends_on:
      controller-0:
        condition: service_healthy
      controller-1:
        condition: service_healthy
      controller-2:
        condition: service_healthy

  init-kafka:
    image: confluentinc/cp-kafka@sha256:997e05f8551c64d1e643baf269237e3bb13808e5909d2b936e8e986226bfc78a
    volumes:
      - ./create_kafka_topics.sh:/etc/confluent/docker/create_kafka_topics.sh:ro
    command: ["/bin/bash", "/etc/confluent/docker/create_kafka_topics.sh"]
    depends_on:
      server-0:
        condition: service_healthy
      server-1:
        condition: service_healthy
      server-2:
        condition: service_healthy
      server-3:
        condition: service_healthy
    networks:
      - ecommerce-network
    
    
  postgresdb:
    image: postgres:18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_MULTIPLE_DATABASES: product,inventory,customer,shopping
    volumes:
      - ./init_dbs.sh:/docker-entrypoint-initdb.d/init_dbs.sh:ro
      - ./setup_hba.sh:/docker-entrypoint-initdb.d/setup_hba.sh:ro
      - ecommerce-data:/var/lib/postgresql/data
    command:
      [
        "postgres",
        "-c",
        "wal_level=logical",
        "-c",
        "max_replication_slots=10",
        "-c",
        "max_wal_senders=10",
      ]
    networks:
      - ecommerce-network

  kafka-connect:
    image: quay.io/debezium/connect@sha256:bd0ef1f8aa0690bc9bc0dec78c209f24f5d53ffd40fe5bc36c22db87052a51ad
    ports:
      - "8083:8083"
    depends_on:
      server-0:
        condition: service_healthy
      server-1:
        condition: service_healthy
      server-2:
        condition: service_healthy
      server-3:
        condition: service_healthy
      postgresdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/connectors/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    environment:
      BOOTSTRAP_SERVERS: server-0:9092,server-1:9093,server-2:9094,server-3:9095
      GROUP_ID: connect-cluster
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      LISTENERS: HTTP://0.0.0.0:8083
      REST_ADVERTISED_LISTENERS: HTTP://0.0.0.0:8083
    networks:
      - ecommerce-network

  admin:
    image: olayinka17/ecommerce-admin:latest
    depends_on:
      server-0:
        service_healthy
      server-1:
        service_healthy
      server-2:
        service_healthy
      server-3:
        service_healthy
      postgresdb:
        service_healthy
      redis:
        service_healthy
    deploy:
      replicas: 3
      update_config:
        parallelism: 2
        delay: 10s
        failure_action: rollback
      restart_policy:
        condition: on-failure
        max_attempts: 3
        delay: 3s
        window: 120s
    networks:
      - ecommerce-network
    environment:
      PORT: 4092
      NODE_ENV: production
      SHOPPING_CLIENT: "localhost"
      INVENTORY_CLIENT: "localhost"
      PRODUCT_CLIENT: "localhost"
      REDIS_HOST: "redis"
      REDIS_PORT: 6379

  customer:
    image: olayinka17/ecommerce-customer:latest
    depends_on:
      server-0:
        condition: service_healthy
      server-1:
        condition: service_healthy
      server-2:
        condition: service_healthy
      server-3:
        condition: service_healthy
      postgresdb:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 3
      update_config:
        parallelism: 2
        delay: 10s
        failure_action: rollback
      restart_policy:
        condition: on-failure
        max_attempts: 3
        delay: 3s
        window: 120s
    networks:
      - ecommerce-network
    environment:
      PORT: 4093
      NODE_ENV: production
      JWT_EXPIRES_IN: 1h
      KAFKA_BROKERS: "server-0:9092,server-1:9093,server-2:9094,server-3:9095"
      REDIS_HOST: "redis"
      REDIS_PORT: 6379

  inventory:
    image: olayinka17/ecommerce-inventory:latest
    depends_on:
      server-0:
        condition: service_healthy
      server-1:
        condition: service_healthy
      server-2:
        condition: service_healthy
      server-3:
        condition: service_healthy
      postgresdb:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 3
      update_config:
        parallelism: 2
        delay: 10s
        failure_action: rollback
      restart_policy:
        condition: on-failure
        max_attempts: 3
        delay: 3s
        window: 120s
    networks:
      - ecommerce-network
    environment:
      KAFKA_BROKERS: "server-0:9092,server-1:9093,server-2:9094,server-3:9095"
      GRPC_HOST: "inventory"

  orchestrator:
    image: orchestrator
    depends_on:
      server-0:
        condition: service_healthy
      server-1:
        condition: service_healthy
      server-2:
        condition: service_healthy
      server-3:
        condition: service_healthy
      postgresdb:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 3
      update_config:
        parallelism: 2
        delay: 10s
        failure_action: rollback
      restart_policy:
        condition: on-failure
        max_attempts: 3
        delay: 3s
        window: 120s
    networks:
      - ecommerce-network
    environment:
      KAFKA_BROKERS: "server-0:9092,server-1:9093,server-2:9094,server-3:9095"
  product:
    image: olayinka17/ecommerce-products:latest
    depends_on:
      server-0:
        condition: service_healthy
      server-1:
        condition: service_healthy
      server-2:
        condition: service_healthy
      server-3:
        condition: service_healthy
      postgresdb:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 3
      update_config:
        parallelism: 2
        delay: 10s
        failure_action: rollback
      restart_policy:
        condition: on-failure
        max_attempts: 3
        delay: 3s
        window: 120s
    networks:
      - ecommerce-network
    environment:
      PORT: 4094
      NODE_ENV: production
      GRPC_HOST: "product"
      REDIS_HOST: "redis"
      REDIS_PORT: 6379

  shopping:
    image: olayinka17/ecommerce-shopping:latest
    depends_on:
      server-0:
        condition: service_healthy
      server-1:
        condition: service_healthy
      server-2:
        condition: service_healthy
      server-3:
        condition: service_healthy
      postgresdb:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 3
      update_config:
        parallelism: 2
        delay: 10s
        failure_action: rollback
      restart_policy:
        condition: on-failure
        max_attempts: 3
        delay: 3s
        window: 120s
    networks:
      - ecommerce-network
    environment:
      PORT: 4095
      NODE_ENV: production
      KAFKA_BROKERS: "server-0:9092,server-1:9093,server-2:9094,server-3:9095"
      GRPC_HOST: "shopping"
      PRODUCT_CLIENT: "localhost"
      REDIS_HOST: "redis"
      REDIS_PORT: 6379

  redis:
    image: redis:alpine
    deploy:
      replicas: 3
    networks:
      - ecommerce-network
    volumes:
      - cache-data:/data
  
  nginx-proxy:
    image: olayinka17/ecommerce-proxy:latest
    depends_on:
      admin:
        condition: service_healthy
      customer:
        condition: service_healthy
      inventory:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
      product:
        condition: service_healthy
      shopping:
        condition: service_healthy
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
    deploy:
      mode: global
    networks:
      - ecommerce-network
