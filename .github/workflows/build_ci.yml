name: Reusable build ci

on:
  workflow_call:
    inputs:
      service-name:
        description: Service name to build
        required: true
        type: string
      node-version:
        description: Node.js version to use
        required: false
        type: string
        default: '24'
      image-name: 
        required: true
        type: string
      stack-name:
        required: false
        type: string
        default: ecommerce
      github-sha:
        required: true
        type: string
      # secrets:
      #   DOCKER_USERNAME:
      #     required: true
      #   DOCKER_PASSWORD:
      #     required: true
      #   SWARM_MANAGER_IP:
      #     required: true

permissions:
  contents: read
  packages: write

  
jobs:
  build:
    runs-on: self-hosted
    # defaults:
    #   run:
    #     shell: bash
    
    steps:
      - name: Checkout code
        # if: ${{ inputs.service-name != 'proxy' }}
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        if: ${{ inputs.service-name != 'proxy' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'
      

      - name: Install dependencies
        if: ${{ inputs.service-name != 'proxy' }}
        # shell: bash
        run: npm ci

      - name: Test each services
        if: ${{ inputs.service-name != 'proxy' }}
        # shell: bash
        run: 
          npm run test --workspace=${{ inputs.service-name }}
      
      - name: Docker login
        uses: docker/login-action@v4
        with: 
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push Docker image
        # shell: bash
        if: ${{ inputs.service-name != 'proxy' }}
        run: |
          IMAGE_TAG=${{ inputs.github-sha }}
          docker build -f ./src/${{ inputs.service-name }}/Dockerfile -t ${{ inputs.image-name }}:$IMAGE_TAG .
          docker push ${{ inputs.image-name }}:$IMAGE_TAG
          # echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
       
      - name: Build and push proxy Docker image
        if: ${{ inputs.service-name == 'proxy' }}
        run: |
          IMAGE_TAG=${{ inputs.github-sha }}
          docker build -f ./${{ inputs.service-name }}/Dockerfile -t ${{ inputs.image-name }}:$IMAGE_TAG .
          docker push ${{ inputs.image-name }}:$IMAGE_TAG
          # echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
        
      - name: Verify image can be pulled
        # shell: bash
        run: docker pull ${{ inputs.image-name }}:${{ inputs.github-sha }}

      - name: Update compose file with new image
        # shell: bash
        run: |
          sed -i  "s|image: ${{ inputs.service-name }}|image: ${{ inputs.image-name }}:${{ inputs.github-sha }}|g" docker-compose.yml
        

